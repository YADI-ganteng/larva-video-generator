name: 🎮 Generate Animated Video

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install deps
      run: |
        sudo apt-get install -y ffmpeg
        pip install pillow gTTS numpy "moviepy>=2.0.0" imageio imageio-ffmpeg
    - name: Generate Video
      run: python video_generator.py
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: animated-video
        path: output/*.mp4
        retention-days: 7
