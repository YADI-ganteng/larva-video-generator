name: 🎮 Generate Animated Video 360p

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        pip install pillow gTTS numpy
        pip install "moviepy>=2.0.0"
        pip install imageio imageio-ffmpeg

    - name: Generate Animated Video
      run: |
        python video_generator.py

    - name: Upload Video
      uses: actions/upload-artifact@v4
      with:
        name: larva-animated-360p
        path: output/*.mp4
        retention-days: 7
